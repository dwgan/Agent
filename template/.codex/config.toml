# 项目级 Codex 配置。将整个 template 目录中的内容复制到新项目根目录后生效。

[agents]
enabled = true
# 三个专用角色足以覆盖多数嵌入式任务；具体任务仍建议按依赖关系顺序执行。

[agents.architect]
config_file = "agents/architect.toml"

[agents.coder]
config_file = "agents/coder.toml"

[agents.reviewer]
config_file = "agents/reviewer.toml"

[agents.observer]
config_file = "agents/observer.toml"

